<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This is a CRAZY cobblemon server. We are keeping it relatively small kinda like HermitCraft. Come Join!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crazycobblesmp.com/">
  <meta property="og:title" content="a CRAZY cobblemon server">
  <meta property="og:description" content="Welcome to a CRAZY cobblemon server.">

  <!-- Encoded space (%20) for the filename -->
  <meta property="og:image" content="https://crazycobblesmp.com/assets/mascot%20(1).png">
  <meta name="theme-color" content="#a058f2">

  <!-- FORCES THE LARGE BANNER IN DISCORD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://crazycobblesmp.com/assets/mascot%20(1).png">

  <link rel="icon" type="image/png" href="assets/logo (1).png">
  <title>a CRAZY cobblemon server</title>

  <style>
    @font-face {
      font-family: 'CobblemonFont';
      src: url('assets/MinecraftCLEAN.otf') format('opentype'); 
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: inherit;
    }

    body {
      background-image: url('background.png');
      background-repeat: no-repeat;
      
      /* Stretches the image to cover the entire screen smoothly */
      background-size: cover;
      
      /* Keeps the image centered and pinned while scrolling */
      background-position: center center;
      background-attachment: fixed;
      
      background-color: #e2b007;
      font-family: 'CobblemonFont', Verdana, sans-serif;
      font-size: 25px;
      color: #000000;
      margin: 0;
      padding: 0;
    }

    /* FULL-WIDTH BLACK BAR */
    .topnav {
      background: #000000;
      width: 100%;
      padding: 12px 24px;
    }

    .topnav-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between; /* Pushes links to left/center and copyright to far right */
      align-items: center;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .topnav a,
    .copyright {
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      line-height: 1;
    }

    .topnav a:hover {
      text-decoration: underline;
    }

    .page {
      max-width: 1500px;
      margin: 20px auto; 
      
      background-color: #0066ff; 
      border: 3px solid #000088;  
      border-radius: 12px;  
      
      padding: 25px;
      
      color: #ffffff;
      min-height: 1190px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }

    .badge img {
      display: block;
      width: 70px;
      height: 70px;
    }

    .title-slot {
      flex: 1;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffeb3b; /* Bright yellow for visibility against blue background */
      font-size: 45px;
    }

    .art-slot {
      width: 90px;
      height: 90px;
      border: 1px dashed #cccccc;
    }

    .intro {
      padding: 0 16px 16px;
      line-height: 1.5;
    }

    .body {
      display: flex;
      gap: 30px;
      padding: 0 16px 24px;
    }

    .sidebar {
      width: 320px; /* Widened to fit large font without wrapping */
      flex-shrink: 0;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dot {
      width: 30px; /* Scaled to match large sidebar text */
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-features { background: #2e8b57; }
    .dot-gallery  { background: #cc3333; }
    .dot-rules    { background: #3366cc; }
    .dot-connect  { background: #d9a400; }
    .dot-discord  { background: #7a3ba0; }

    .sidebar-item a {
      color: #f1eded;
      font-size: 23px;
      font-weight: bold;
      text-decoration: none;
    }

    .sidebar-item a:hover {
      text-decoration: underline;
    }

    .newslist {
      flex: 1;
    }

    .news-item {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .news-thumb {
      width: 48px;
      height: 48px;
      border: 1px solid #999999;
      flex-shrink: 0;
    }

    .news-headline a {
      color: #ffff00; /* Bright yellow for news link visibility */
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="topnav">
  <div class="topnav-inner">
    <div class="nav-links">
      <!-- Added Home Button -->
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
      <a href="https://discord.gg/kzsx8pXvTH" target="_blank">Discord</a>
    </div>
    <span class="copyright">© All Rights Reserved</span>
  </div>
</nav>

  <div class="page">
    <header class="header">
      <div class="badge">
        <img src="assets/server-icon.webp" alt="server mascot">
      </div>
      <div class="title-slot">Mod Features</div>
      <div class="art-slot"></div>
    </header>

    <p class="intro">
     Our modpack includes various quality of life mods such as <span style="color: rgb(255, 206, 45);">Just Enough Items and Gravestones </span>. It also includes <span style="color: rgb(255, 206, 45);">Cobblemon: Mega Showdown, WardenTools, Biomes O' Plenty, and more. </span>
    </p>

    <div class="body">

      </aside>

        </div>
      </section>

    </div>

  </div>
</body>
</html>
