<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This is a CRAZY cobblemon server. We are keeping it relatively small kinda like HermitCraft. Come Join!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crazycobblesmp.com/">
  <meta property="og:title" content="a CRAZY cobblemon server">
  <meta property="og:description" content="Welcome to a CRAZY cobblemon server.">

  <!-- Encoded space (%20) for the filename -->
  <meta property="og:image" content="https://crazycobblesmp.com/assets/mascot%20(1).png">
  <meta name="theme-color" content="#a058f2">

  <!-- FORCES THE LARGE BANNER IN DISCORD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://crazycobblesmp.com/assets/mascot%20(1).png">

  <link rel="icon" type="image/png" href="assets/logo (1).png">
  <title>a CRAZY cobblemon server</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Verdana, Arial, sans-serif;
      font-size: 13px;
      color: #000000;
      background: #0000;
    }

    /* FULL-WIDTH BLACK BAR */
    .topnav {
      background: #000000;
      width: 100%;
      padding: 12px 0;
    }

    .topnav-inner {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .topnav a {
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
    }

    .topnav a:hover {
      text-decoration: underline;
    }

    .page {
      max-width: 620px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }

    .badge img {
      display: block;
      width: 70px;
      height: 70px;
    }

    .title-slot {
      flex: 1;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ce1111;
      font-size: 30px;
    }

    .art-slot {
      width: 90px;
      height: 90px;
      border: 1px dashed #cccccc;
    }

    .intro {
      padding: 0 16px 16px;
      line-height: 1.5;
    }

    .body {
      display: flex;
      gap: 20px;
      padding: 0 16px 24px;
    }

    .sidebar {
      width: 150px;
      flex-shrink: 0;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-features { background: #2e8b57; }
    .dot-gallery  { background: #cc3333; }
    .dot-rules    { background: #3366cc; }
    .dot-connect  { background: #d9a400; }
    .dot-discord  { background: #7a3ba0; }

    .sidebar-item a {
      color: #000000;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }

    .sidebar-item a:hover {
      text-decoration: underline;
    }

    .newslist {
      flex: 1;
    }

    .news-item {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .news-thumb {
      width: 48px;
      height: 48px;
      border: 1px solid #999999;
      flex-shrink: 0;
    }

    .news-headline a {
      color: #0000cc;
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a href="features.html">Features</a>
      <a href="gallery.html">Gallery</a>
      <a href="rules.html">Rules</a>
      <a href="https://discord.gg/kzsx8pXvTH" target="_blank">Discord</a>
    </div>
  </nav>

  <div class="page">
    <header class="header">
      <div class="badge">
        <img src="assets/server-icon.webp" alt="server mascot">
      </div>
      <div class="title-slot">a CRAZY cobblemon Server</div>
      <div class="art-slot">smth idk some image </div>
    </header>
