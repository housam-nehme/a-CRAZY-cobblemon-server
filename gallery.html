<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This is a CRAZY cobblemon server. We are keeping it relatively small kinda like HermitCraft. Come Join!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://crazycobblesmp.com/">
  <meta property="og:title" content="a CRAZY cobblemon server">
  <meta property="og:description" content="Welcome to a CRAZY cobblemon server.">

  <!-- Encoded space (%20) for the filename -->
  <meta property="og:image" content="https://crazycobblesmp.com/assets/mascot%20(1).png">
  <meta name="theme-color" content="#a058f2">

  <!-- FORCES THE LARGE BANNER IN DISCORD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://crazycobblesmp.com/assets/mascot%20(1).png">

  <link rel="icon" type="image/png" href="assets/logo (1).png">
  <title>a CRAZY cobblemon server</title>

  <style>
    @font-face {
      font-family: 'CobblemonFont';
      src: url('assets/MinecraftCLEAN.otf') format('opentype'); 
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: inherit;
    }

    body {
      background-image: url('background.png');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-color: #e2b007;
      font-family: 'CobblemonFont', Verdana, sans-serif;
      font-size: 25px;
      color: #000000;
      margin: 0;
      padding: 0;
    }

    /* FULL-WIDTH BLACK BAR */
    .topnav {
      background: #000000;
      width: 100%;
      padding: 12px 24px;
    }

    .topnav-inner {
      max-width: 1500px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between; 
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .topnav a,
    .copyright {
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      text-transform: uppercase;
      text-decoration: none;
      line-height: 1;
    }

    .topnav a:hover {
      text-decoration: underline;
    }

    .page {
      max-width: 1250px;
      width: calc(100% - 20px);
      margin: 20px auto; 
      background-color: #0066ff; 
      border: 3px solid #000088;  
      border-radius: 12px;  
      padding: 25px;
      color: #ffffff;
      min-height: 200px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
    }

    .badge img {
      display: block;
      width: 70px;
      height: 70px;
    }

    .title-slot {
      flex: 1;
      min-width: 0;
      height: auto;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffeb3b; 
      font-size: 45px;
      text-align: center;
      word-break: break-word;
    }

    .art-slot {
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .intro {
      padding: 0 16px 16px;
      line-height: 1.5;
    }

    /* Carousel Container Styling */
    .carousel-container {
      position: relative;
      max-width: 650px;
      width: 100%;
      height: 380px;
      margin: 20px auto;
      border: 4px solid #ffcc00; 
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Image Slides */
    .carousel-slide {
      display: none;
      width: 100%;
      height: 100%;
    }

    .carousel-slide.active {
      display: block;
    }

    .carousel-slide img {
      width: 100%;           
      height: 100%;         
      max-width: 100%;       
      object-fit: cover;     
      display: block;
    }

    /* Navigation Buttons */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffcc00;
      border: 2px solid #ffcc00;
      font-size: 20px;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
      font-family: inherit;
    }

    .carousel-btn:hover {
      background-color: #ffcc00;
      color: #000;
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    /* Navigation Dots */
    .carousel-dots {
      text-align: center;
      margin-top: 10px;
    }

    /* MOBILE / PHONE OVERRIDES */
    @media (max-width: 768px) {
      .topnav {
        padding: 10px 12px;
      }

      .topnav-inner {
        flex-direction: column;
        text-align: center;
        gap: 10px;
      }

      .nav-links {
        justify-content: center;
        gap: 10px 14px;
      }

      .topnav a, 
      .copyright {
        font-size: 13px;
      }

      .page {
        padding: 15px;
      }

      .header {
        flex-direction: column;
        text-align: center;
      }

      .title-slot {
        font-size: 32px;
      }

      .carousel-container {
        height: 250px; /* Reduces carousel height for smaller screens */
      }
    }
  </style>
</head>
<body>
  <nav class="topnav">
    <div class="topnav-inner">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="features.html">Features</a>
        <a href="gallery.html">Gallery</a>
        <a href="rules.html">Rules</a>
        <a href="https://discord.llomeli.com" target="_blank">Discord</a>
      </div>
      <span class="copyright">© All Rights Reserved</span>
    </div>
  </nav>

  <div class="page">
    <header class="header">
      <div class="badge">
        <img src="assets/server-icon.webp" alt="server mascot">
      </div>
      <div class="title-slot">Gallery</div>
      <div class="art-slot">
        <img src="assets/garchompgif.gif" alt="garchomp" style="width: 100%; height: 100%; object-fit: contain; display: block;">
      </div>
    </header>

    <p class="intro">
      Here is a look at the cobblemon server we all love :D
    </p>

    <!-- Carousel Container -->
    <div class="carousel-container">
      <!-- Slides -->
      <div class="carousel-slide active">
        <img src="assets/izachfly.png" alt="Cobblemon Screenshot 1">
      </div>
      <div class="carousel-slide">
        <img src="assets/gal-lounge (1).jpg" alt="Cobblemon Screenshot 2">
      </div>
      <div class="carousel-slide">
        <img src="assets/gal-legendary (1).jpg" alt="Cobblemon Screenshot 3">
      </div>
      <div class="carousel-slide">
        <img src="assets/meow.png" alt="Cobblemon Screenshot 4">
      </div>
      <div class="carousel-slide">
        <img src="assets/gal-wooper (1).jpg" alt="Cobblemon Screenshot 5">
      </div>
      <div class="carousel-slide">
        <img src="assets/shiny duck.png" alt="Cobblemon Screenshot 6">
      </div>
      <div class="carousel-slide">
        <img src="assets/reshiram.png" alt="Cobblemon Screenshot 7">
      </div>
      <div class="carousel-slide">
        <img src="assets/izach look at pokemon.png" alt="Cobblemon Screenshot 8">
      </div>
      <div class="carousel-slide">
        <img src="assets/aura clash.png" alt="Cobblemon Screenshot 9">
      </div>
      <div class="carousel-slide">
        <img src="assets/armarouge.png" alt="Cobblemon Screenshot 10">
      </div>
      <div class="carousel-slide">
        <img src="assets/gal-hq (1).jpg" alt="Cobblemon Screenshot 11">
      </div>
      <div class="carousel-slide">
        <img src="assets/gal-supply (1).jpg" alt="Cobblemon Screenshot 12">
      </div>
      <div class="carousel-slide">
        <img src="assets/END.png" alt="Cobblemon Screenshot 13">
      </div>
      <div class="carousel-slide">
        <img src="assets/japan.png" alt="Cobblemon Screenshot 14">
      </div>
      <div class="carousel-slide">
        <img src="assets/pond.png" alt="Cobblemon Screenshot 15">
      </div>
      <div class="carousel-slide">
        <img src="assets/garchomp.png" alt="Cobblemon Screenshot 16">
      </div>
      <div class="carousel-slide">
        <img src="assets/castle.png" alt="Cobblemon Screenshot 17">
      </div>

      <!-- Navigation Arrows -->
      <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
      <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
    </div>

    <!-- Dots Indicator -->
    <div class="carousel-dots">
      <span class="dot active" onclick="currentSlide(0)"></span>
      <span class="dot" onclick="currentSlide(1)"></span>
      <span class="dot" onclick="currentSlide(2)"></span>
    </div>
  </div>

  <script>
    let slideIndex = 0;

    function showSlide(index) {
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('.carousel-dots .dot');

      if (index >= slides.length) slideIndex = 0;
      if (index < 0) slideIndex = slides.length - 1;

      slides.forEach(slide => slide.classList.remove('active'));
      dots.forEach(dot => dot.classList.remove('active'));

      slides[slideIndex].classList.add('active');
      if (dots[slideIndex]) {
        dots[slideIndex].classList.add('active');
      }
    }

    function moveSlide(step) {
      showSlide(slideIndex += step);
    }

    function currentSlide(index) {
      showSlide(slideIndex = index);
    }
  </script>
</body>
</html>
