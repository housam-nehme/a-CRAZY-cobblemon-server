    /* Carousel Container Styling */
.carousel-container {
  position: relative;
  max-width: 650px;
  height: 380px;
  margin: 20px auto;

  border-radius: 8px;

}

/* Image Slides */
.carousel-slide {
  display: none;
}

.carousel-slide.active {
  display: block;
}

.carousel-slide img {
  width: 100%;           /* Makes image match the container's width */
  height: 350px;         /* Set whatever fixed height you want for the gallery box */
  max-width: 100%;       /* Prevents image from overflowing horizontally */
  object-fit: cover;     /* Crops image neatly to fit the box without stretching */
  display: block;
}

/* Navigation Buttons */
.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0, 0, 0, 0.6);
  color: #ffcc00;
  border: 2px solid #ffcc00;
  font-size: 20px;
  padding: 8px 14px;
  cursor: pointer;
  user-select: none;
  font-family: inherit;
}

.carousel-btn:hover {

}

.carousel-btn.prev { left: 10px; }
.carousel-btn.next { right: 10px; }

/* Navigation Dots */
.carousel-dots {
  text-align: center;
  position: absolute;
  bottom: 12px;
  width: 100%;

  <script>
  let slideIndex = 0;

  function showSlide(index) {
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.dot');

    if (index >= slides.length) slideIndex = 0;
    if (index < 0) slideIndex = slides.length - 1;

    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));

    slides[slideIndex].classList.add('active');
    dots[slideIndex].classList.add('active');
  }

  function moveSlide(step) {
    showSlide(slideIndex += step);
  }

  function currentSlide(index) {
    showSlide(slideIndex = index);
  }
</script>
